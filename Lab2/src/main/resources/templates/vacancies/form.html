<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма вакансії</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; }
        input, textarea, select { width: 350px; padding: 6px; }
    </style>
</head>
<body>
<h2 th:text="${vacancy.id == null} ? 'Створення вакансії' : 'Редагування вакансії'">Форма</h2>

<form th:action="@{/vacancies/employer/save}" th:object="${vacancy}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div class="form-group">
        <label>Назва вакансії:</label>
        <input type="text" th:field="*{title}" required/>
    </div>

    <div class="form-group">
        <label>Тип зайнятості:</label>
        <select th:field="*{employmentType}">
            <option th:each="type : ${employmentTypes}"
                    th:value="${type}"
                    th:text="${type.title}">Тип</option>
        </select>
    </div>

    <div class="form-group">
        <label>Опис вакансії:</label>
        <textarea th:field="*{description}" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label>Вимоги до кандидата:</label>
        <textarea th:field="*{requirements}" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label>Зарплата ($):</label>
        <input type="number" step="0.01" th:field="*{salary}" placeholder="Залиште порожнім за домовленістю"/>
    </div>

    <button type="submit">Зберегти</button>
    <a th:href="@{/vacancies/employer}">Скасувати</a>
</form>
</body>
</html>
